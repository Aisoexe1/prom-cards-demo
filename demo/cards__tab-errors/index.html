</style><script>(function () {
  var toastEl, timer;
  function toast(text) {
    if (!toastEl) {
      toastEl = document.createElement("div");
      toastEl.className = "demo-toast";
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = text;
    toastEl.classList.add("on");
    clearTimeout(timer);
    timer = setTimeout(function () { toastEl.classList.remove("on"); }, 2600);
  }
  function meta(name) {
    var m = document.querySelector('meta[name="' + name + '"]');
    return m ? m.getAttribute("content") : null;
  }

  document.addEventListener("click", function (event) {
    var t = event.target;
    var tab = t.closest && t.closest("[data-lang-tab]");
    if (tab) {
      var lang = tab.getAttribute("data-lang-tab");
      document.querySelectorAll("[data-lang-panel]").forEach(function (p) {
        p.classList.toggle("hidden", p.getAttribute("data-lang-panel") !== lang);
      });
      document.querySelectorAll("[data-lang-tab]").forEach(function (b) {
        var on = b === tab;
        b.classList.toggle("bg-white", on);
        b.classList.toggle("font-medium", on);
        b.classList.toggle("shadow-sm", on);
        b.classList.toggle("text-muted", !on);
      });
      return;
    }
    var button = t.closest && t.closest("button");
    if (button) {
      if (button.closest("summary")) return;
      var intent = button.getAttribute("value");
      if (button.type === "submit" && (intent === "approve" || intent === "skip")) {
        event.preventDefault();
        var next = meta("demo-next");
        toast(intent === "approve" ? "Картку схвалено. У демо зміни не зберігаються." : "Картку пропущено. У демо зміни не зберігаються.");
        setTimeout(function () { if (next) location.href = next; }, 1100);
        return;
      }
      event.preventDefault();
      toast("Це демо: кнопка працює в справжній програмі.");
      return;
    }
    var link = t.closest && t.closest("a[data-demo-off]");
    if (link) {
      event.preventDefault();
      toast("Цей розділ не входить у демо.");
    }
  });

  document.addEventListener("submit", function (event) {
    event.preventDefault();
    toast("Це демо: збереження працює в справжній програмі.");
  });
})();
